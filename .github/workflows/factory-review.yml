name: factory-review

# When Qodo's review lands on a factory PR: report a clean review, or let the
# runner check the findings and fix the real ones, at most twice. Never merges.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  review:
    if: github.event.issue.pull_request && github.event.comment.user.login == 'qodo-code-review[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The PR branch is not trusted: only factory code from the default branch
    # runs, and GH_TOKEN is given only to the steps that need it.
    env:
      PR: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      FACTORY_TEST_USER: factorytest
      MAX_ROUNDS: 2
    steps:
      - name: Find the PR branch and its ticket
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(gh pr view "$PR" -R "$REPO" --json headRefName --jq .headRefName)"
          case "$branch" in factory/issue-*) ;; *) echo "Not a factory PR."; exit 0 ;; esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "issue=${branch#factory/issue-}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pr.outputs.branch
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      # Trusted copy of the runner, from the default branch. Checked out after
      # the PR branch so the first checkout does not clean it away.
      - uses: actions/checkout@v4
        if: steps.pr.outputs.branch
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          persist-credentials: false
      - name: Keep the trusted copy out of git status and git clean
        if: steps.pr.outputs.branch
        run: echo '/.factory-trusted/' >> .git/info/exclude
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.branch
        with:
          node-version: 22
      - name: Create the unprivileged user that runs the checks
        if: steps.pr.outputs.branch
        run: id -u "$FACTORY_TEST_USER" >/dev/null 2>&1 || sudo useradd -M -s /usr/sbin/nologin "$FACTORY_TEST_USER"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.318
      - name: Read the review and act on it
        if: steps.pr.outputs.branch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body }}
          COMMENT_CREATED: ${{ github.event.comment.created_at }}
          COMMENT_UPDATED: ${{ github.event.comment.updated_at }}
          ISSUE: ${{ steps.pr.outputs.issue }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          # Hand the PR and its ticket to a person. The ticket may not carry in-review.
          to_person() {
            gh pr edit "$PR" -R "$REPO" --add-label needs-human
            gh issue edit "$ISSUE" -R "$REPO" --remove-label in-review --add-label needs-human \
              || gh issue edit "$ISSUE" -R "$REPO" --add-label needs-human || true
          }
          mkdir -p .factory && printf '%s' "$COMMENT" > .factory/review.html
          count="$(node -e "import('./.factory-trusted/factory/lib.mjs').then(m=>console.log(m.countFindings(require('fs').readFileSync('.factory/review.html','utf8'))))")"
          if [ "$count" = "null" ]; then echo "Not a review summary."; exit 0; fi
          # The factory never changes its own rules, code or workflows.
          own="$(git diff --name-only "origin/$DEFAULT_BRANCH...HEAD" -- factory .github AGENTS.md)"
          if [ -n "$own" ]; then
            gh pr comment "$PR" -R "$REPO" --body "$(printf 'Factory: this branch changes factory/, .github/ or AGENTS.md compared with %s. Stopping here for a person.\n\n```\n%s\n```' "$DEFAULT_BRANCH" "$own")"
            to_person
            exit 0
          fi
          if [ "$count" = "0" ]; then
            head="$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq .headRefOid)"
            # The review counts for the commit it saw. Use the later of the comment's
            # created and updated times (Qodo may edit its comment).
            reviewed="$(date -d "$COMMENT_CREATED" +%s)"
            if [ -n "$COMMENT_UPDATED" ]; then
              updated="$(date -d "$COMMENT_UPDATED" +%s)"
              if [ "$updated" -gt "$reviewed" ]; then reviewed="$updated"; fi
            fi
            committed="$(git log -1 --format=%ct HEAD)"
            # If the PR head is not the checked-out commit, the branch moved after this run started.
            if [ "$head" != "$(git rev-parse HEAD)" ] || [ "$committed" -gt "$reviewed" ]; then
              gh pr comment "$PR" -R "$REPO" --body "Factory: Qodo's clean review predates the latest commit (${head:0:7}), so it is not reported as clean. Waiting for a review of that commit."
              exit 0
            fi
            gh pr comment "$PR" -R "$REPO" --body "Factory: Qodo reported no findings on ${head:0:7}. Tests passed in the runner. Waiting for a person to decide on the merge."
            exit 0
          fi
          rounds="$(git log --oneline origin/main..HEAD --grep='^Review round' | wc -l | tr -d ' ')"
          if [ "$rounds" -ge "$MAX_ROUNDS" ]; then
            gh pr comment "$PR" -R "$REPO" --body "Factory: Qodo still reports $count finding(s) after $rounds fix rounds. Stopping here for a person."
            to_person
            exit 0
          fi
          REVIEW_FILE=.factory/review.html REVIEW_COUNT="$count" node .factory-trusted/factory/run-ticket.mjs
          if [ "$(cat .factory/status)" != "ok" ]; then
            gh pr comment "$PR" -R "$REPO" --body-file .factory/log.md
            to_person
            exit 0
          fi
          # Stage only what the runner wrote; any other change stops the run.
          if [ -s .factory/files.txt ]; then git --literal-pathspecs add --pathspec-from-file=.factory/files.txt; fi
          extra="$(git status --porcelain --untracked-files=all -- . ':!.factory' | grep -v '^[AM]  ' || true)"
          if [ -n "$extra" ]; then
            gh pr comment "$PR" -R "$REPO" --body "$(printf 'Factory: files changed that the runner did not write. Nothing was pushed.\n\n```\n%s\n```' "$extra")"
            to_person
            exit 0
          fi
          gh pr comment "$PR" -R "$REPO" --body-file .factory/pr-body.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "hanadul-factory"
          git config user.email "hanadul-factory@users.noreply.github.com"
          git commit -m "Review round $((rounds + 1)): fix confirmed findings"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:$BRANCH"
